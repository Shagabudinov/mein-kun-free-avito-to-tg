version: '3.8'

services:
  avito-supabase:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: avito-supabase
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - app-network

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: telegram-bot
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
